# Edit optional item icons here. Remove any :icon: token to hide it.
# Unsupported servers, older Java clients, and Bedrock players automatically receive clean text without item sprites.
tokens:
  # Editable tokens. Use these as {prefix}, {theme}, {muted}, {white}, {good}, and {bad} in messages.yml.
  prefix: ":iron_sword: {theme}FoCombatTag &8\u00bb {muted}"
  theme: "#03fc88"
  muted: "#a7b8b0"
  white: "#ffffff"
  good: "#3ecf8e"
  bad: "#ff5d73"

no-permission: "{prefix}{bad}No permission."
player-only: "{prefix}{bad}Player only."
unknown-player: "{prefix}{bad}Player not found."
bad-syntax: "{prefix}{bad}Use: {theme}{usage}"
reload-started: "{prefix}{white}Reloading..."
reload-complete: "{prefix}:emerald: {good}Reload complete."
reload-failed: "{prefix}:redstone: {bad}Reload failed. {muted}{error}"
admin-usage: "{prefix}{bad}Use: {theme}/{label} {usage}"
admin-command-missing: "{prefix}{bad}Missing admin command in plugin.yml: {theme}{command}"
admin-command-failed: "{prefix}{bad}Command failed. {muted}{error}"
combat-tagged: "{prefix}:clock: {bad}Combat tagged. {muted}{seconds}s remaining."
combat-untagged: "{prefix}:emerald: {good}No longer combat tagged."
actionbar-tagged: ":clock: {bad}Combat {muted}| {theme}{seconds}s"
command-blocked: "{prefix}{bad}Command blocked while combat tagged. {muted}{seconds}s left."
pearl-cooldown: "{prefix}{bad}Ender pearl cooldown. {muted}{seconds}s left."
elytra-vault-stored: "{prefix}:elytra: {bad}Elytra sent to elytra vault. {muted}Use {theme}/elytravault{muted}."
elytra-vault-reminder: "{prefix}{bad}You have {theme}{count} {bad}elytra in elytra vault. {muted}Use {theme}/elytravault{muted}."
elytra-vault-empty: "{prefix}{white}Elytra vault empty."
elytra-vault-claimed: "{prefix}:elytra: {good}Claimed {theme}{count} {good}elytra from elytra vault."
elytra-vault-inventory-full: "{prefix}{bad}Inventory full. {muted}Claimed {theme}{claimed}{muted}; {theme}{remaining} {muted}still in elytra vault."
tagged-player: "{prefix}{good}Tagged {theme}{player} {muted}for {seconds}s."
tagged-all: "{prefix}{good}Tagged {theme}{count} {muted}online players."
tag-cancelled: "{prefix}{bad}Tag blocked by another plugin."
untagged-player: "{prefix}{good}Untagged {theme}{player}."
untagged-all: "{prefix}{good}Untagged {theme}{count} {muted}players."
tag-list-empty: "{prefix}{white}No active combat tags."
tag-list-header: "{prefix}{white}Active tags: {theme}{count}"
tag-list-entry: "{prefix}{theme}{player} {muted}- {seconds}s left"
status-online-tagged: "{prefix}{theme}{player} {muted}is tagged for {theme}{seconds}s {muted}against {white}{opponent}{muted}. Cause: {theme}{cause}"
status-online-clear: "{prefix}{theme}{player} {muted}is not combat tagged."
editor-opened: "{prefix}:book: {white}Editor opened."
editor-saved: "{prefix}:emerald: {good}Saved {theme}{setting}{muted}: {white}{value}"
editor-invalid-item: "{prefix}{bad}Hold a placeable block on cursor."
editor-save-failed: "{prefix}:redstone: {bad}Save failed. {muted}{error}"
editor-prompt-command-add: "{prefix}{white}Type allowed command pattern. {muted}Example: {theme}team chat {muted}or {theme}team *{muted}. Type {bad}cancel{muted}."
editor-prompt-command-remove: "{prefix}{white}Type exact allowed command to remove. {muted}Type {bad}cancel{muted}."
editor-prompt-number: "{prefix}{white}Type {setting}. {muted}Range: {theme}{min}-{max}{muted}. Type {bad}cancel{muted}."
editor-prompt-text: "{prefix}{white}Type {setting}. {muted}Current: {theme}{current}{muted}. {hint} Type {bad}cancel{muted}."
editor-invalid-number: "{prefix}{bad}Invalid number. {muted}Range: {theme}{min}-{max}"
editor-prompt-cancelled: "{prefix}{bad}Prompt cancelled."
editor-list-empty: "{prefix}{bad}Allowed command list empty."
editor-command-not-found: "{prefix}{bad}Command pattern not found."
editor-command-removed: "{prefix}{good}Removed {theme}{command}"
native-dialog-fallback: "{prefix}{bad}Native dialogs unavailable. {muted}Using chat input."
worldguard-missing: "{prefix}{bad}WorldGuard missing. {muted}No-PVP region guard disabled."
